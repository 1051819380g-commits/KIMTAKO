<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교 계약업무 흐름도</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#fff; --ink:#14181f; --muted:#6b7280; --line:#e3e6ec;
  --accent:#1f6feb; --core:#0f9d58; --warn:#d97706; --loop:#7c3aed;
  --chip:#eef1f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9198a1;--line:#2a313c;
        --accent:#4b93ff;--core:#3fb950;--warn:#e0913a;--loop:#a371f7;--chip:#21262d;
        --shadow:0 1px 2px rgba(0,0,0,.4);}
}
:root[data-theme="light"]{--bg:#f7f8fa;--panel:#fff;--ink:#14181f;--muted:#6b7280;
  --line:#e3e6ec;--accent:#1f6feb;--core:#0f9d58;--warn:#d97706;--loop:#7c3aed;--chip:#eef1f6;}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#9198a1;
  --line:#2a313c;--accent:#4b93ff;--core:#3fb950;--warn:#e0913a;--loop:#a371f7;--chip:#21262d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding:20px 20px 60px}
header h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:13px}
.gates{display:flex;gap:6px;margin:20px 0 14px;overflow-x:auto;padding-bottom:4px}
.gate{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;cursor:pointer;min-width:132px;box-shadow:var(--shadow)}
.gate .gid{font:600 11px/1.2 ui-monospace,monospace;color:var(--muted)}
.gate .gnm{font-weight:650;font-size:13px;margin-top:2px}
.gate.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.gate.off{opacity:.5}
.gate .gnum{font:700 10px/1.2 ui-monospace,monospace;color:var(--accent)}
/* 개요 게이트: 절차 탭과 확실히 다른 생김새 — 파선 + 중립 배경 + 세로 구분선 */
.gate.intro{border-style:dashed;border-color:var(--muted);
  background:color-mix(in srgb,var(--muted) 8%,var(--panel))}
.gate.intro.on{border-color:var(--accent);border-style:solid}
.gate .gtag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;
  border-radius:999px;background:color-mix(in srgb,var(--muted) 20%,transparent);
  color:var(--muted);margin-left:5px;vertical-align:1px}
.gsep{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;justify-content:center;
  padding:0 8px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.02em;
  border-left:2px dashed var(--line);margin-left:2px;text-align:center;line-height:1.3}
.gdesc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.gdesc.intro{border-left-color:var(--muted)}
/* 개요 안내 배너 */
.intro-banner{display:flex;gap:12px;align-items:flex-start;
  background:color-mix(in srgb,var(--warn) 9%,var(--panel));
  border:1px solid color-mix(in srgb,var(--warn) 38%,var(--line));
  border-radius:10px;padding:13px 16px;margin-bottom:14px}
.intro-banner .ico{font-size:19px;line-height:1.2}
.intro-banner h4{margin:0 0 3px;font-size:14px;color:var(--warn);letter-spacing:-.01em}
.intro-banner p{margin:0;font-size:12.5px;color:var(--ink)}
.intro-banner button{margin-top:9px;background:var(--accent);color:#fff;border:0;
  border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:650;cursor:pointer;
  font-family:inherit}
.intro-banner button:hover{filter:brightness(1.08)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;min-width:88px}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--muted)}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.flabel{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media(max-width:1400px){.layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;order:-1}}
.board{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  overflow:auto;box-shadow:var(--shadow)}
.grid{position:relative;display:grid;min-width:1080px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hcell{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);padding:10px 12px}
.hcell .sid{font:600 10.5px/1.2 ui-monospace,monospace;color:var(--muted)}
.hcell .snm{font-weight:650;font-size:13px}
.hcorner{position:sticky;top:0;left:0;z-index:4;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 12px;font-size:11.5px;color:var(--muted)}
.lcell{position:sticky;left:0;z-index:2;background:var(--panel);border-top:1px solid var(--line);
  padding:12px;font-weight:600;font-size:12.5px;display:flex;align-items:center;min-width:132px}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);
  padding:10px 9px;display:flex;flex-direction:column;gap:8px;min-height:74px;
  position:relative;z-index:2}
.node{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  cursor:pointer;transition:.13s;box-shadow:var(--shadow)}
.node:hover{transform:translateY(-1px);border-color:var(--accent)}
.node .nid{font:600 10px/1.2 ui-monospace,monospace;color:var(--muted);
  display:flex;justify-content:space-between;gap:6px;align-items:center}
.node .ntt{font-weight:600;font-size:12.5px;margin-top:3px;letter-spacing:-.01em}
.node .nmeta{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}
.node.core{border-color:var(--core);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--core) 40%,transparent)}
.node.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.node.loop{border-style:dashed;border-color:var(--loop)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 32%,transparent)}
.node.dim{opacity:.26}
/* 개요 노드: 실행 노드와 구분되도록 중립 회색 + 파선. 핵심/유의 배지는 그대로 둔다. */
.node.ref{background:color-mix(in srgb,var(--muted) 7%,var(--panel));
  border-style:dashed;border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
.node.ref.core{border-color:var(--core);box-shadow:none}
.node.ref.warn{background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-color:var(--warn)}
.node.ref.sel{border-style:solid;border-color:var(--accent)}
.grid.ref .hcell,.grid.ref .lcell{background:color-mix(in srgb,var(--muted) 5%,var(--panel))}
.bdg{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}
.bdg.core{background:color-mix(in srgb,var(--core) 16%,transparent);color:var(--core)}
.bdg.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bdg.loop{background:color-mix(in srgb,var(--loop) 16%,transparent);color:var(--loop)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;
  position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;box-shadow:var(--shadow)}
aside h2{margin:0 0 2px;font-size:17px;letter-spacing:-.02em}
aside .pid{font:600 11px/1.2 ui-monospace,monospace;color:var(--muted)}
.sect{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sect h3{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;font-weight:700}
.kv{font-size:13px;margin-bottom:3px}
.tag{display:inline-block;background:var(--chip);border-radius:5px;padding:2px 8px;
  font-size:11.5px;margin:0 4px 4px 0}
.deadline{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);
  border-radius:6px;padding:7px 10px;font-size:12.5px;font-weight:600}
a.form{display:block;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);
  border-radius:6px;margin-bottom:5px;text-decoration:none;color:var(--ink);background:var(--bg)}
a.form:hover{border-color:var(--accent);color:var(--accent)}
a.form span{display:block;font-size:10.5px;color:var(--muted)}
.jump{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;margin:0 5px 5px 0;cursor:pointer;background:var(--bg)}
.jump:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 10px}
.soon{padding:44px 20px;text-align:center;color:var(--muted)}
footer{margin-top:24px;color:var(--muted);font-size:11.5px;text-align:center}
</style><style id="kbg-skin">

비, 환경관리비 등을 정산한다. 일용근로자는 동일현장 1월 평균 7일 이상 작업자만 인정되고 사용자부담금(50%)만 정산된다."},{"id":"P601","gate":"G5","step":"T1","lane":"vendor","tracks":["common"],"title":"준공신고서·검사 요청","badge":null,"owner":"계약상대자","deadline":"","basis":[],"forms":[],"note":"일반급(계약금액대로) / 기성금(완성부분) / 준공금(공제 후) 중 해당 유형으로 요청."},{"id":"P602","gate":"G5","step":"T2","lane":"contract","tracks":["common"],"title":"검사","badge":"핵심","owner":"검사공무원","deadline":"서면 통지받은 날부터 14일 이내","basis":["지방계약법 제17조(검사)","지방계약법 시행령 제64조~제66조"],"forms":[],"note":"계약상대자로부터 완료 통지를 받은 날부터 14일 이내(지방계약법 제17조, 시행령 제64조~제66조). 계약금액 100억원 이상이거나 기술적 특수성으로 14일 안에 어려우면 7일 범위에서 연장(한시 특례 고시 기간에는 단축 기준 적용). 기성·기납대가를 30일마다 지급하는 경우 감독조서로 갈음할 수 있으나 3회마다 1회는 정식검사를 한다."},{"id":"P603","gate":"G5","step":"T2","lane":"contract","tracks":["goods"],"title":"검수","badge":null,"owner":"물품출납공무원","deadline":"","basis":[],"forms":[],"note":"검사에 합격한 목적물이 손상 없이 계약 수량대로 납품되었는지 확인한다."},{"id":"P604","gate":"G5","step":"T2","lane":"audit","tracks":["common"],"title":"전문기관 지정 검사","badge":null,"owner":"전문기관","deadline":"","basis":[],"forms":[],"note":"건설사업관리 대상 공사, 재질·성능·규격 검사에 전문지식이 필요한 계약. 조달청 납품검사 대행을 활용할 수 있다."},{"id":"P605","gate":"G5","step":"T2","lane":"contract","tracks":["common"],"title":"검사조서 작성 생략 판단","badge":null,"owner":"계약부서","deadline":"","basis":["지방계약법 시행령 제65조"],"forms":[],"note":"3천만원 미만 계약, 매각계약, 전기·가스·수도 공급 등 성질상 불필요한 경우."},{"id":"P606","gate":"G5","step":"T3","lane":"contract","tracks":["work","svc"],"title":"목적물 인수","badge":null,"owner":"계약부서","deadline":"검사완료 통지일부터 7일 이내 인수요청이 없으면 현장인수증명서 발급","basis":[],"forms":[],"note":"부분사용과 부가공사가 있는 경우 별도로 처리한다."},{"id":"P610","gate":"G5","step":"T4","lane":"contract","tracks":["common"],"title":"지연배상금 산출·부과","badge":"유의","owner":"계약부서","deadline":"","basis":["지방계약법 시행령 제90조"],"forms":[],"note":"지연배상금 = 계약금액 × 지연배상금률 × 지연일수. 상한은 계약금액의 30%. 계약금액의 10% 이상에 달했는데도 해제·해지하지 않으면 잔여 이행금액에 대한 계약보증금을 추가 징구한다. 나라장터 종합쇼핑몰 납품요구는 조달청 계약이라 지연배상금률이 1천분의 0.75(국가계약법 시행규칙)이고, 지방계약에 따른 \"계약체결\"이 아니므로 10일 이상 지체해도 수의계약 배제 ":"G5","cross":false},{"from":"P612","to":"P330","type":"loop","label":"수의계약 배제 → Ⅲ","gate":"G5","cross":true},{"from":"P610","to":"P614","type":"branch","label":"불이행 지속","gate":"G5","cross":false},{"from":"P614","to":"P613","type":"seq","label":"촉구 불응","gate":"G5","cross":false},{"from":"P613","to":"P303","type":"loop","label":"부정당업자 제재 → Ⅲ 자격 제한","gate":"G5","cross":true},{"from":"P606","to":"P620","type":"seq","label":"","gate":"G5","cross":false},{"from":"P620","to":"P621","type":"seq","label":"","gate":"G5","cross":false},{"from":"P621","to":"P630","type":"seq","label":"","gate":"G5","cross":false},{"from":"P630","to":"P633","type":"seq","label":"","gate":"G5","cross":false},{"from":"P633","to":"P631","type":"seq","label":"","gate":"G5","cross":false},{"from":"P631","to":"P632","type":"seq","label":"기성","gate":"G5","cross":false},{"from":"P611","to":"P631","type":"seq","label":"상계 후 지급","gate":"G5","cross":false},{"from":"P631","to":"P701","type":"seq","label":"→ Ⅶ 사후관리","gate":"G5","cross":true},{"from":"P701","to":"P702","type":"seq","label":"","gate":"G6","cross":false},{"from":"P702","to":"P703","type":"seq","label":"","gate":"G6","cross":false},{"from":"P703","to":"P704","type":"seq","label":"","gate":"G6","cross":false},{"from":"P704","to":"P705","type":"seq","label":"물품","gate":"G6","cross":false},{"from":"P704","to":"P710","type":"seq","label":"","gate":"G6","cross":false},{"from":"P705","to":"P710","type":"seq","label":"","gate":"G6","cross":false},{"from":"P710","to":"P711","type":"seq","label":"","gate":"G6","cross":false},{"from":"P711","to":"P712","type":"seq","label":"하자 발생","gate":"G6","cross":false},{"from":"P712","to":"P713","type":"seq","label":"","gate":"G6","cross":false},{"from":"P712","to":"P710","type":"loop","label":"재검사","gate":"G6","cross":false}]},"assets":[]}</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const F = DATA.flow, ASSETS = DATA.assets;
const byId = Object.fromEntries(F.nodes.map(n=>[n.id,n]));
const assetById = Object.fromEntries(ASSETS.map(a=>[a.id,a]));
const LANE = Object.fromEntries(F.lanes.map(l=>[l.id,l]));
/* 계약방법과 목적물은 서로 독립된 축이므로 필터를 둘로 나눈다.
   해당 축의 트랙을 하나도 갖지 않은 노드는 그 축 전체에 적용되는 것으로 본다. */
const METHOD=['bid','nego2','nego1','proc'], OBJECT=['work','goods','svc'];
let gate='G0', fMethod='all', fObject='all', sel=null;

document.getElementById('ttl').textContent = F.meta.title;
document.getElementById('sub').textContent = F.meta.subtitle+' · '+F.meta.note;
document.getElementById('foot').textContent =
  "경남 2026 계약실무편람·관계 법령 기준 · 노드를 누르면 담당·기한·근거가 나옵니다";

/* ── 게이트 ─────────────────────────────── */
/* 개요 게이트(Ⅰ)는 절차가 아니므로 탭 모양·번호 매김·보드 색을 전부 분리한다.
   실무자가 Ⅰ을 "1번째 할 일"로 오해하는 사례가 있어 넣은 구분이다. */
const isIntro=g=>g.kind==='intro';
function drawGates(){
  const el=document.getElementById('gates'); el.innerHTML='';
  let ord=0;
  F.gates.forEach((g,i)=>{
    if(!isIntro(g) && isIntro(F.gates[i-1]||{})){
      const s=document.createElement('div');
      s.className='gsep'; s.innerHTML='실제<br>업무<br>흐름 →';
      el.appendChild(s);
    }
    const has = F.nodes.some(n=>n.gate===g.id);
    const intro=isIntro(g);
    if(!intro) ord++;
    const d=document.createElement('div');
    d.className='gate'+(g.id===gate?' on':'')+(has?'':' off')+(intro?' intro':'');
    d.innerHTML='<div class="gid">'+(intro?'':'<span class="gnum">'+ord+'단계</span> · ')+g.roman+
      (intro?'<span class="gtag">개요</span>':'')+'</div>'+
      '<div class="gnm">'+g.name+'</div>';
    d.onclick=()=>{ gate=g.id; sel=null; render(); };
    el.appendChild(d);
  });
  const g=F.gates.find(x=>x.id===gate);
  const gd=document.getElementById('gdesc');
  gd.className='gdesc'+(isIntro(g)?' intro':'');
  gd.innerHTML=g.desc;
  drawBanner(g);
}

function drawBanner(g){
  const b=document.getElementById('banner');
  if(!g.intro){ b.innerHTML=''; return; }
  b.innerHTML='<div class="intro-banner"><div class="ico">ℹ️</div><div>'+
    '<h4>'+g.intro.headline+'</h4><p>'+g.intro.body+'</p>'+
    '<button onclick="goGate(\''+g.intro.ctaGate+'\')">'+g.intro.cta+' →</button>'+
    '</div></div>';
}
function goGate(id){ gate=id; sel=null; render(); scrollTo({top:0,behavior:'smooth'}); }

/* ── 트랙 필터 (2축) ────────────────────── */
function drawTracks(){
  const mk=(elId,axis,cur,set)=>{
    const el=document.getElementById(elId); el.innerHTML='';
    [{id:'all',name:'전체'}].concat(F.tracks.filter(t=>axis.includes(t.id))).forEach(t=>{
      const b=document.createElement('button');
      b.className='chip'+(t.id===cur?' on':'');
      b.textContent=t.name;
      b.onclick=()=>{ set(t.id); sel=null; render(); };
      el.appendChild(b);
    });
  };
  mk('fmethod',METHOD,fMethod,v=>fMethod=v);
  mk('fobject',OBJECT,fObject,v=>fObject=v);
}

function visible(n){
  const m=n.tracks.filter(t=>METHOD.includes(t));
  const o=n.tracks.filter(t=>OBJECT.includes(t));
  const okM = fMethod==='all' || m.length===0 || m.includes(fMethod);
  const okO = fObject==='all' || o.length===0 || o.includes(fObject);
  return okM && okO;
}

function drawStats(){
  const ns=F.nodes.filter(n=>n.gate===gate&&visible(n));
  const lanes=new Set(ns.map(n=>n.lane));
  const g=F.gates.find(x=>x.id===gate), intro=isIntro(g);
  const s=[[intro?'확인 항목':'절차 노드',ns.length],['행위 레인',lanes.size],
           [intro?'판단 기준':'단계',(F.steps[gate]||[]).length],
           ['핵심',ns.filter(n=>n.badge==='핵심').length],
           ['유의',ns.filter(n=>n.badge==='유의').length],
           ['기한 명시',ns.filter(n=>n.deadline).length]];
  document.getElementById('stats').innerHTML=
    s.map(([k,v])=>'<div class="stat"><b>'+v+'</b><span>'+k+'</span></div>').join('');
}

/* ── 보드 ───────────────────────────────── */
function drawBoard(){
  const board=document.getElementById('board');
  const steps=F.steps[gate];
  if(!steps){
    board.innerHTML='<div class="soon">이 단계의 상세 흐름은 다음 작업분에서 추가됩니다.<br>'+
      '<small>'+F.gates.find(g=>g.id===gate).desc+'</small></div>';
    return;
  }
  const ns=F.nodes.filter(n=>n.gate===gate&&visible(n));
  const lanes=F.lanes.filter(l=>ns.some(n=>n.lane===l.id));
  const gt=F.gates.find(x=>x.id===gate), intro=isIntro(gt);
  const g=document.createElement('div');
  g.className='grid'+(intro?' ref':'');
  g.style.gridTemplateColumns='132px repeat('+steps.length+',minmax(190px,1fr))';

  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','wires');
  g.appendChild(svg);

  const corner=document.createElement('div');
  corner.className='hcorner'; corner.textContent='레인 \\ '+(gt.axisLabel||'단계');
  g.appendChild(corner);
  steps.forEach(([sid,snm])=>{
    const h=document.createElement('div'); h.className='hcell';
    h.innerHTML='<div class="sid">'+sid+'</div><div class="snm">'+snm+'</div>';
    g.appendChild(h);
  });

  lanes.forEach(l=>{
    const lc=document.createElement('div'); lc.className='lcell'; lc.textContent=l.short;
    g.appendChild(lc);
    steps.forEach(([sid])=>{
      const c=document.createElement('div'); c.className='cell';
      ns.filter(n=>n.lane===l.id&&n.step===sid).forEach(n=>c.appendChild(nodeEl(n)));
      g.appendChild(c);
    });
  });

  board.innerHTML=''; board.appendChild(g);
  requestAnimationFrame(()=>drawWires(svg,g,ns));
}

function nodeEl(n){
  const cls={'핵심':'core','유의':'warn','회귀':'loop'}[n.badge]||'';
  const ref=isIntro(F.gates.find(x=>x.id===n.gate))?' ref':'';
  const d=document.createElement('div');
  d.className='node '+cls+ref+(sel===n.id?' sel':'');
  d.id='node-'+n.id;
  if(sel){
    const rel=new Set([sel]);
    F.edges.forEach(e=>{ if(e.from===sel)rel.add(e.to); if(e.to===sel)rel.add(e.from); });
    if(!rel.has(n.id)) d.classList.add('dim');
  }
  const bdg=n.badge?'<span class="bdg '+cls+'">'+n.badge+'</span>':'';
  const meta=[];
  if(n.deadline) meta.push('⏱ '+n.deadline.split('/')[0].trim());
  if(n.forms.length) meta.push('📎 '+n.forms.length);
  d.innerHTML='<div class="nid"><span>'+n.id+'</span>'+bdg+'</div>'+
    '<div class="ntt">'+n.title+'</div>'+
    (meta.length?'<div class="nmeta">'+meta.map(m=>'<span>'+m+'</span>').join('')+'</div>':'');
  d.onclick=()=>{ sel=(sel===n.id?null:n.id); render(); };
  return d;
}

function drawWires(svg,grid,ns){
  const ids=new Set(ns.map(n=>n.id));
  const base=grid.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+grid.scrollWidth+' '+grid.scrollHeight);
  svg.setAttribute('width',grid.scrollWidth); svg.setAttribute('height',grid.scrollHeight);
  let defs='<defs>'+
    ['seq:var(--muted)','loop:var(--loop)','branch:var(--warn)'].map(x=>{
      const [k,c]=x.split(':');
      return '<marker id="ar-'+k+'" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" '+
        'markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="'+c+'"/></marker>';
    }).join('')+'</defs>';
  let paths='';
  F.edges.filter(e=>e.gate===gate&&ids.has(e.from)&&ids.has(e.to)).forEach(e=>{
    const a=document.getElementById('node-'+e.from), b=document.getElementById('node-'+e.to);
    if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.right-base.left, y1=ra.top-base.top+ra.height/2;
    const x2=rb.left-base.left,  y2=rb.top-base.top+rb.height/2;
    const active = !sel || e.from===sel || e.to===sel;
    const col = e.type==='loop'?'var(--loop)':e.type==='branch'?'var(--warn)':'var(--muted)';
    const dash = e.type==='loop'?' stroke-dasharray="5 4"':'';
    let d;
    if(byId[e.from].step===byId[e.to].step){
      /* 같은 단계, 레인만 다름 → 세로로 잇는다.
         가로 좌표로 판정하면 역방향으로 오인해 크게 우회하므로 반드시 먼저 처리. */
      const cx1=ra.left-base.left+ra.width/2, cx2=rb.left-base.left+rb.width/2;
      const down=rb.top>ra.top;
      const sy=down?ra.bottom-base.top:ra.top-base.top;
      const ty=down?rb.top-base.top:rb.bottom-base.top;
      const my=(sy+ty)/2;
      d='M'+cx1+','+sy+' C'+cx1+','+my+' '+cx2+','+my+' '+cx2+','+ty;
    }else if(x2>=x1-4){
      const mx=(x1+x2)/2;
      d='M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2;
    }else{ /* 회귀: 아래로 우회 */
      const y=Math.max(y1,y2)+38;
      d='M'+x1+','+y1+' C'+(x1+46)+','+y+' '+(x2-46)+','+y+' '+x2+','+y2;
    }
    paths+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(active?1.7:1)+
      '" opacity="'+(active?.85:.2)+'"'+dash+' marker-end="url(#ar-'+e.type+')"/>';
  });
  svg.innerHTML=defs+paths;
}

/* ── 상세 패널 ──────────────────────────── */
function drawPanel(){
  const p=document.getElementById('panel');
  if(!sel){
    const g=F.gates.find(x=>x.id===gate), intro=isIntro(g);
    p.innerHTML='<div class="pid">'+(intro?'개요':g.id)+' · '+g.roman+'</div><h2>'+g.name+
      (intro?' <span class="gtag">개요</span>':'')+'</h2>'+
      '<div class="sect"><h3>'+(intro?'이 장은':'이 단계는')+'</h3><div class="kv">'+g.desc+'</div></div>'+
      (intro?'<div class="sect"><h3>업무 시작 지점</h3><div class="kv">실제 절차는 '+
        '<b>Ⅱ 계약의 추진</b>의 사업계획(품의) 수립부터입니다. 여기 항목들은 그 전에 '+
        '따져 두는 기준이며, 순서대로 결재를 올리는 단계가 아닙니다.</div></div>':'')+
      '<div class="sect"><h3>보는 법</h3><div class="kv">가로는 진행 순서, 세로는 누가 하는지입니다. '+
      '위 필터로 <b>입찰 / 2인 견적 수의 / 1인 견적 수의 / 조달</b> 중 내 건에 맞는 길만 볼 수 있습니다.</div>'+
      '<div class="kv" style="margin-top:8px;color:var(--muted)">노드를 클릭하면 담당·법정기한·근거조문이 나옵니다.</div></div>';
    return;
  }
  const n=byId[sel];
  const ins=F.edges.filter(e=>e.to===sel), outs=F.edges.filter(e=>e.from===sel);
  const jump=(id,label)=>{
    const t=byId[id]; if(!t) return '';
    const g=t.gate!==n.gate
      ? '<b style="color:var(--accent)">'+F.gates.find(x=>x.id===t.gate).roman+'</b> ' : '';
    return '<span class="jump" onclick="pick(\''+id+'\')">'+g+id+' '+t.title+
      (label?' · '+label:'')+'</span>';
  };
  let h='<div class="pid">'+n.id+' · '+LANE[n.lane].name+'</div><h2>'+n.title+'</h2>';
  if(n.badge) h+='<span class="bdg '+({'핵심':'core','유의':'warn','회귀':'loop'}[n.badge])+
    '" style="font-size:11px">'+n.badge+'</span>';
  h+='<div class="sect"><h3>담당</h3><div class="kv">'+(n.owner||'-')+'</div></div>';
  if(n.deadline) h+='<div class="sect"><h3>기한</h3><div class="deadline">'+n.deadline+'</div></div>';
  if(n.note) h+='<div class="sect"><h3>업무 내용</h3><div class="kv">'+n.note+'</div></div>';
  if(n.basis.length) h+='<div class="sect"><h3>근거</h3>'+
    n.basis.map(b=>'<span class="tag">'+b+'</span>').join('')+'</div>';
  if(n.forms.length) h+='<div class="sect"><h3>관련 서식·자료</h3>'+n.forms.map(id=>{
      const a=assetById[id];
      if(!a) return '<span class="tag">'+id+'</span>';
      return '<a class="form" href="assets/'+encodeURIComponent(a.file)+'" target="_blank">'+
        a.title+'<span>'+a.id+' · '+a.type+' · '+a.ext.toUpperCase()+'</span></a>';
    }).join('')+'</div>';
  h+='<div class="sect"><h3>흐름</h3>';
  h+= ins.length? '<div class="kv" style="color:var(--muted);font-size:11px">이전</div>'+
      ins.map(e=>jump(e.from,e.label)).join('') : '';
  h+= outs.length? '<div class="kv" style="color:var(--muted);font-size:11px;margin-top:6px">다음</div>'+
      outs.map(e=>jump(e.to,e.label)).join('') : '';
  h+='</div>';
  p.innerHTML=h;
}
function pick(id){
  const n=byId[id]; if(!n) return;
  gate=n.gate;                       /* 다른 장의 노드면 해당 장으로 이동 */
  if(!visible(n)){ fMethod='all'; fObject='all'; }  /* 필터에 가려지면 필터 해제 */
  sel=id; render();
  document.getElementById('panel').scrollTop=0;
  const el=document.getElementById('node-'+id);
  if(el) el.scrollIntoView({block:'center',inline:'center'});
}

function render(){ drawGates(); drawTracks(); drawStats(); drawBoard(); drawPanel(); }
render();
addEventListener('resize',()=>drawBoard());
</script></body></html>
